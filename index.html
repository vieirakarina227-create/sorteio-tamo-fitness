
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4b2b19">
  <title>Sorteio de Prêmios</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="pagina">
    <div class="conteudo">

      <div class="marca">
        <span class="simbolo">✧</span>
        <h2>TER</h2>
        <p>TAMO FITNESS</p>
        <span class="linha"></span>
        <p class="assinatura">RICHARLLYSSON IMPORTS</p>
      </div>

      <header>
        <p class="subtitulo">UMA SURPRESA ESPECIAL PARA VOCÊ</p>
        <h1>SORTEIO</h1>
        <p class="destaque">de Prêmios</p>
        <p class="descricao">
          Seu prêmio está esperando por você.
        </p>
      </header>

      <div class="presente" aria-hidden="true">
        🎁
      </div>

      <button id="botaoSortear" type="button">
        CLIQUE AQUI
        <span>PARA SORTEAR</span>
      </button>

      <section id="resultado" aria-live="polite" hidden>
        <p>SEU PRÊMIO É</p>
        <h2 id="nomePremio"></h2>
      </section>

      <p class="rodape">UMA SURPRESA, UM MOMENTO ESPECIAL</p>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
